{% for tag in tag_list %}
    <!--data-id lets the js keep the accordion open state across reloads of this list-->
    <details data-id="{{ tag.pk }}">

        <summary>{{ tag.name }}</summary>

        <div>
        <!--necessary div to contain tasks into accordion-->
            <button type="button" hx-get="update_tag/{{ tag.pk }}">Modify tag</button>

        {% for task in tag.task_set.all %}
            {% include 'agendjang/_task_item.html' %}
        {% endfor %}

        </div>
    </details>
{% endfor %}
