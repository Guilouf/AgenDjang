<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agendjang</title>
    {% load static %}
    <link rel='stylesheet' href="{% static 'css/impose_ton_style.css' %}" />

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>

    <!--api urls and the csrf token are handed to the static js through data-* attributes -->
    <script src="{% static 'js/js_calendar.js' %}"
            data-dateranges-url="{% url 'agendjang:api:dateranges-list' %}"
            data-tag-list-url="{% url 'agendjang:tag_list' %}"
            data-project-list-url="{% url 'agendjang:project_list' %}"
            data-events-url="{% url 'agendjang:api:events-list' %}"
            data-csrf-token="{% csrf_token %}">
    </script>

</head>

<!--every hx-get button loads its content into the dialog, shown by js_calendar once filled-->
<body hx-target="#dialog-content">
    <dialog id="dialog">
        <button type="button" class="dialog-close" onclick="this.closest('dialog').close()">&times;</button>
        <div id="dialog-content"></div>
    </dialog>

    <!--fullcalendar sets the height of #calendar itself, so the layout is styled on this wrapper-->
    <div id="calendar_area">
        <div id='calendar'></div>
    </div>

    <div id=tags>

        <!--switched by the js; only the lists inside the panels are reloaded, so the selected tab is kept-->
        <div class="sidebar_tabs" role="tablist">
            <button type="button" role="tab" aria-selected="true" aria-controls="tags_panel">Tags</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="projects_panel">Projects</button>
        </div>

        <div id="tags_panel" role="tabpanel">
            <button id="btn_create_tag" type="button" hx-get="create_tag">New tag</button>

            <!--reloaded by the js after each form submit; Draggable listens on #tags, so it keeps working-->
            <div id="tag_list">
                <!--replaces itself on page load: its hx-target, needed to override the body's dialog target,
                would otherwise be inherited by the sidebar's own buttons-->
                <div hx-get="{% url 'agendjang:tag_list' %}" hx-trigger="load" hx-target="this" hx-swap="outerHTML"></div>
            </div>
        </div>

        <div id="projects_panel" role="tabpanel" hidden>
            <button id="btn_create_project" type="button" hx-get="create_project">New project</button>

            <!--same loading and reloading as #tag_list-->
            <div id="project_list">
                <div hx-get="{% url 'agendjang:project_list' %}" hx-trigger="load" hx-target="this" hx-swap="outerHTML"></div>
            </div>
        </div>

    </div>

    <footer>
        <button id="btn_help" type="button" hx-get="help">Help</button>
    </footer>

</body>


</html>
