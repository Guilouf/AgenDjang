<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agendjang</title>
    {% load static %}
    <link rel='stylesheet' href="{% static 'css/impose_ton_style.css' %}" />

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>

    <!--api urls and the csrf token are handed to the static js through data-* attributes -->
    <script src="{% static 'js/js_calendar.js' %}"
            data-dateranges-url="{% url 'agendjang:api:dateranges-list' %}"
            data-tag-list-url="{% url 'agendjang:tag_list' %}"
            data-events-url="{% url 'agendjang:api:events-list' %}"
            data-csrf-token="{% csrf_token %}">
    </script>

</head>

<!--every hx-get button loads its content into the dialog, shown by js_calendar once filled-->
<body hx-target="#dialog-content">
    <dialog id="dialog">
        <button type="button" class="dialog-close" onclick="this.closest('dialog').close()">&times;</button>
        <div id="dialog-content"></div>
    </dialog>

    <div id='calendar'></div>

    <div id=tags>

        <button id="btn_create_tag" type="button" hx-get="create_tag">New tag</button>

    <!--reloaded by the js after each form submit; Draggable listens on #tags, so it keeps working-->
    <div id="tag_list">
        {% include 'agendjang/_tag_list.html' %}
    </div>

    </div>

    <footer>
        <button id="btn_help" type="button" hx-get="help">Help</button>
    </footer>

</body>


</html>
